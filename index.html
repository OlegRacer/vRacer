<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Заміна бренду в CSV файлі</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .box { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>Заміна "AZS" на "Заправка" у CSV файлі</h2>
    
    <div class="box">
        <input type="file" id="csvFile" accept=".csv">
    </div>

    <button id="downloadBtn" onclick="processFile()" disabled>Обробити та завантажити</button>

    <script>
        let fileContent = '';
        let fileName = '';

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            fileName = file.name;
            const reader = new FileReader();
            reader.onload = function(event) {
                fileContent = event.target.result;
                document.getElementById('downloadBtn').disabled = false;
            };
            reader.readAsText(file);
        });

        function processFile() {
            // Замінюємо всі входження AZS на Заправка
            const modifiedContent = fileContent.replaceAll('AZS', 'Заправка');

            // Створюємо новий файл для скачування
            const blob = new Blob([modifiedContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', 'modified_' + fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
