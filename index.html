<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>GPX to CSV Converter</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; }
        .box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        button { padding: 10px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        #data-status { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Конвертер GPX у CSV</h1>
    <div class="box">
        <input type="file" id="gpx-file" accept=".gpx">
        <button onclick="processFile()">Додати файл</button>
        <p id="data-status">Завантажено точок: 0</p>
    </div>
    <button onclick="downloadCSV()">Завантажити підсумковий CSV</button>
    <button onclick="clearData()" style="background: #dc3545;">Очистити пам'ять</button>
</div>

<script>
    // Завантаження даних з пам'яті браузера
    let store = JSON.parse(localStorage.getItem('gpx_data') || '[]');
    updateUI();

    async function processFile() {
        const fileInput = document.getElementById('gpx-file');
        if (!fileInput.files.length) return alert('Оберіть файл!');

        const file = fileInput.files[0];
        const text = await file.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, "text/xml");
        const waypoints = xml.getElementsByTagName("wpt");

        for (let wpt of waypoints) {
            store.push({
                Brand: wpt.getElementsByTagName("brand")[0]?.textContent || '',
                name: wpt.getElementsByTagName("name")[0]?.textContent || '',
                lat: wpt.getAttribute("lat"),
                lon: wpt.getAttribute("lon"),
                hours: wpt.getElementsByTagName("hours")[0]?.textContent || '',
                toilet: wpt.getElementsByTagName("toilet")[0]?.textContent || ''
            });
        }
        
        localStorage.setItem('gpx_data', JSON.stringify(store));
        updateUI();
        alert('Файл додано!');
    }

    function updateUI() {
        document.getElementById('data-status').innerText = `Завантажено точок: ${store.length}`;
    }

    function downloadCSV() {
        if (store.length === 0) return alert('Немає даних!');
        let csv = "Brand,name,lat,lon,hours,toilet\n";
        store.forEach(row => {
            csv += `${row.Brand},${row.name},${row.lat},${row.lon},${row.hours},${row.toilet}\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'data.csv';
        a.click();
    }

    function clearData() {
        localStorage.removeItem('gpx_data');
        store = [];
        updateUI();
    }
</script>
</body>
</html>
