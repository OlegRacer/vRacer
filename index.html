<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>kb-test — стенд для бага з клавіатурою</title>
<style>
  :root{ --th:48px; }
  html, body {
    margin: 0; padding: 0; background: #000; color: #f2f2f0;
    font-family: -apple-system, system-ui, sans-serif;
    width: 100%; height: 100%; overflow-x: hidden;
  }
  
  /* Контейнер-обгортка для фіксації під visualViewport */
  #appWrapper {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  body.no-scroll #appWrapper { overflow: hidden; touch-action: none; }

  .tb{position:fixed;top:0;left:0;right:0;height:var(--th);display:flex;align-items:center;
    gap:8px;padding:0 8px;background:#111;border-bottom:1px solid #333;z-index:50;
    box-sizing:border-box;}
  .tb button{background:#222;color:#fff;border:1px solid #444;border-radius:8px;padding:6px 10px;font-size:13px;}
  .tb .stat{margin-left:auto;font-size:11px;color:#8f8;white-space:nowrap;}

  .fab-col{position:fixed;right:6px;top:120px;display:flex;flex-direction:column;gap:8px;z-index:40;}
  .fab-col button{width:44px;height:44px;border-radius:50%;background:#1a1a1a;border:1px solid #555;color:#fff;font-size:18px;}

  .content{margin-top:var(--th);padding:12px;padding-bottom:260px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .tile{background:#151515;border:1px solid #333;border-radius:10px;height:90px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#888;}

  .input-bar{position:fixed;left:8px;right:8px;bottom:16px;display:flex;gap:8px;
    background:#151515;border:1px solid #444;border-radius:10px;padding:8px;z-index:60;
    transition:top .15s ease;}
  .input-bar.kb-top{ top:calc(var(--th) + 8px); bottom:auto; }
  .input-bar input{flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid #444;
    background:#111;color:#fff;font-size:16px;}
  .input-bar button{flex-shrink:0;padding:8px 10px;border-radius:8px;border:1px solid #555;
    background:#222;color:#fff;font-size:13px;}

  .log{margin-top:16px;background:#0a0a0a;border:1px solid #333;border-radius:8px;
    padding:8px;font-size:11px;font-family:'JetBrains Mono',monospace;color:#7fd;
    max-height:240px;overflow-y:auto;white-space:pre-wrap;}
  .hint{font-size:12px;color:#888;line-height:1.5;margin:8px 0;}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0;}
  .tsw{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
  .tsw input{opacity:0;width:0;height:0;}
  .sldr{position:absolute;inset:0;background:#333;border-radius:24px;transition:.2s;cursor:pointer;}
  .sldr:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s;}
  .tsw input:checked + .sldr{background:#37e0e6;}
  .tsw input:checked + .sldr:before{transform:translateX(18px);}
</style>
</head>
<body>

<div id="appWrapper">
  <div class="tb">
    <button id="rainBtn">Дощ (утримати 1.5с)</button>
    <button id="lockBtn">🔓 Блок</button>
    <span class="stat" id="stat"></span>
  </div>

  <div class="fab-col">
    <button title="імітація кнопки на карті">📷</button>
    <button title="імітація кнопки на карті">🚩</button>
    <button title="імітація кнопки на карті">✏️</button>
  </div>

  <div class="content">
    <div class="hint">
      Ціль: відтворити "зсув екрана при появі клавіатури" та "тач-зони їдуть" в ізоляції, без великого коду основної програми.
      Тапни в поле внизу → зʼявиться клавіатура → дивись лог і цифри в шапці — де саме розходиться geometry.
    </div>

    <div class="row">
      <label class="tsw"><input type="checkbox" id="hackToggle" checked><span class="sldr"></span></label>
      <span>Хак (createScrollHack) увімкнено</span>
    </div>
    <div class="row">
      <button id="measureBtn">📏 Заміряти зараз</button>
      <button id="clearLogBtn">🗑 Очистити лог</button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="log" id="log"></div>
  </div>

  <div class="input-bar" id="inputBar">
    <input type="text" id="testInput" placeholder="Тапни сюди — зʼявиться клавіатура">
    <button id="closeKbBtn">✕</button>
  </div>
</div>

<script>
// Жорстка фіксація висоти та позиції під VisualViewport для Bluefy/WebKit
function handleVisualViewportResize() {
  const vv = window.visualViewport;
  if (!vv) return;
  const wrapper = document.getElementById('appWrapper');
  wrapper.style.height = `${vv.height}px`;
  wrapper.style.top = `${vv.offsetTop}px`;
  wrapper.style.left = `${vv.offsetLeft}px`;
  wrapper.style.width = `${vv.width}px`;
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleVisualViewportResize);
  window.visualViewport.addEventListener('scroll', handleVisualViewportResize);
  handleVisualViewportResize();
}

const _scrollLockSources = new Set();
function setBodyScrollLock(source, locked){
  if(locked) _scrollLockSources.add(source); else _scrollLockSources.delete(source);
  document.body.classList.toggle('no-scroll', _scrollLockSources.size>0);
}

function createScrollHack(options){
  options = options || {};
  const delay = options.delay!=null ? options.delay : 3000;
  const onStateChange = options.onStateChange;

  let scrollTimer=null;
  let isManuallyLocked=false;
  let isLocked=false;
  let touchActive=false;
  let pendingAfterTouch=false;

  function updateLockState(locked){
    isLocked=locked;
    setBodyScrollLock('scrollhack', locked);
    if(onStateChange) onStateChange(isLocked, isManuallyLocked);
  }

  function triggerHack(){
    const ae=document.activeElement;
    if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT')){
      log('triggerHack(): SKIP — activeElement є полем вводу ('+ae.id+')');
      return;
    }
    if(touchActive){ pendingAfterTouch=true; log('triggerHack(): SKIP — touchActive'); return; }
    if(isManuallyLocked && isLocked) return;
    if(!isManuallyLocked) updateLockState(false);
    
    log('triggerHack(): перевірку пройдено');

    clearTimeout(scrollTimer);
    scrollTimer=setTimeout(function(){
      if(!isManuallyLocked) updateLockState(true);
    }, delay);
  }

  function initListeners(){
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) triggerHack(); });
    window.addEventListener('focus', triggerHack);
    window.addEventListener('pageshow', triggerHack);
    window.addEventListener('orientationchange', function(){ setTimeout(triggerHack, 200); });

    window.addEventListener('touchstart', function(){ touchActive=true; }, {passive:true, capture:true});
    window.addEventListener('touchend', function(){
      touchActive=false;
      if(pendingAfterTouch){
        pendingAfterTouch=false;
        setTimeout(triggerHack, 80);
      }
    }, {passive:true, capture:true});
    window.addEventListener('touchcancel', function(){ touchActive=false; pendingAfterTouch=false; }, {passive:true, capture:true});

    function handleFirstTouch(){
      triggerHack();
      window.removeEventListener('touchstart', handleFirstTouch);
    }
    window.addEventListener('touchstart', handleFirstTouch, {passive:true});

    document.addEventListener('DOMContentLoaded', function(){ setTimeout(triggerHack, 50); });
    window.addEventListener('load', function(){
      setTimeout(triggerHack, 100);
      setTimeout(triggerHack, 300);
    });
  }

  initListeners();

  return {
    toggleManualLock(){
      clearTimeout(scrollTimer);
      if(isLocked){ isManuallyLocked=false; updateLockState(false); }
      else { isManuallyLocked=true; updateLockState(true); }
      return isLocked;
    },
    forceRun: triggerHack
  };
}

let hack=null;
function startHack(){ hack=createScrollHack({delay:3000, onStateChange:(locked)=>log('onStateChange: locked='+locked)}); }
function stopHack(){ hack=null; document.body.classList.remove('no-scroll'); log('Хак вимкнено'); }

document.getElementById('hackToggle').addEventListener('change', function(e){
  if(e.target.checked) startHack(); else stopHack();
});
startHack();

const grid=document.getElementById('grid');
for(let i=1;i<=9;i++){ const t=document.createElement('div'); t.className='tile'; t.textContent='tile '+i; grid.appendChild(t); }

const logEl=document.getElementById('log');
function log(msg){
  const t=new Date().toISOString().substr(11,12);
  logEl.textContent += '['+t+'] '+msg+'\n';
  logEl.scrollTop=logEl.scrollHeight;
}
document.getElementById('clearLogBtn').addEventListener('click', ()=>{ logEl.textContent=''; });

function snapshot(){
  const vv=window.visualViewport;
  const fabRect=document.querySelector('.fab-col button').getBoundingClientRect();
  return 'innerWH='+window.innerWidth+'x'+window.innerHeight
    +' | docClientWH='+document.documentElement.clientWidth+'x'+document.documentElement.clientHeight
    +' | scrollY='+window.scrollY
    +' | vv='+(vv?(Math.round(vv.width)+'x'+Math.round(vv.height)+' offTop='+Math.round(vv.offsetTop)+' scale='+vv.scale.toFixed(2)):'—')
    +' | fabBtnTop='+Math.round(fabRect.top);
}
function refreshStat(){ document.getElementById('stat').textContent=snapshot(); }
document.getElementById('measureBtn').addEventListener('click', ()=>{ log('РУЧНИЙ замір: '+snapshot()); });

['resize','scroll','orientationchange','focus','blur'].forEach(function(evt){
  window.addEventListener(evt, function(){ log('window:'+evt+'  →  '+snapshot()); refreshStat(); }, true);
});
if(window.visualViewport){
  visualViewport.addEventListener('resize', function(){ log('visualViewport:resize  →  '+snapshot()); refreshStat(); });
  visualViewport.addEventListener('scroll', function(){ log('visualViewport:scroll  →  '+snapshot()); refreshStat(); });
}
document.addEventListener('visibilitychange', function(){ log('document:visibilitychange hidden='+document.hidden); });

const testInput=document.getElementById('testInput');
const inputBar=document.getElementById('inputBar');
testInput.addEventListener('focus', function(){
  inputBar.classList.add('kb-top');
  log('input:focus  →  .kb-top додано  →  '+snapshot());
});
testInput.addEventListener('blur', function(){
  inputBar.classList.remove('kb-top');
  log('input:blur  →  .kb-top прибрано  →  '+snapshot());
});
document.getElementById('closeKbBtn').addEventListener('click', function(){ testInput.blur(); });

let rainHoldT=null;
const rainBtn=document.getElementById('rainBtn');
function startHold(){ rainHoldT=setTimeout(()=>{ log('Дощ: утримання 1.5с спрацювало'); rainBtn.style.background='#036'; }, 1500); }
function cancelHold(){ clearTimeout(rainHoldT); rainBtn.style.background='#222'; }
rainBtn.addEventListener('touchstart', function(e){ log('rainBtn:touchstart'); startHold(); }, {passive:true});
rainBtn.addEventListener('touchend', function(){ log('rainBtn:touchend'); cancelHold(); }, {passive:true});

document.getElementById('lockBtn').addEventListener('click', function(){
  if(!hack) return;
  const locked=hack.toggleManualLock();
  this.textContent = locked ? '🔒 Блок' : '🔓 Блок';
  log('Ручний toggleManualLock() → locked='+locked);
});

refreshStat();
setInterval(refreshStat, 500);
</script>
</body>
</html>
