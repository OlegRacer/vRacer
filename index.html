<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Заміна бренду в CSV</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; height: 200px; margin-bottom: 10px; font-family: monospace; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Заміна "AZS" на "Заправка" в CSV</h2>
    
    <label for="inputCsv">Вставте текст CSV:</label>
    <textarea id="inputCsv">brand	name	lat	lon	hours	toilet
AZS	台灣中油	25.2238837	121.6310592	24/7	</textarea>

    <button onclick="replaceBrand()">Замінити та скопіювати</button>

    <label for="outputCsv" style="margin-top: 20px; display: block;">Результат:</label>
    <textarea id="outputCsv"></textarea>

    <script>
        function replaceBrand() {
            const input = document.getElementById('inputCsv').value;
            // Замінюємо всі входження AZS на Заправка (з урахуванням меж слів або просто текст)
            const output = input.replaceAll('AZS', 'Заправка');
            
            const outputArea = document.getElementById('outputCsv');
            outputArea.value = output;
            
            // Автоматичне копіювання в буфер обміну
            outputArea.select();
            navigator.clipboard.writeText(output).then(() => {
                alert('Результат скопійовано в буфер обміну!');
            });
        }
    </script>

</body>
</html>
